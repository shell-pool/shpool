norc = true
noecho = true
shell = "/bin/bash"
session_restore_mode = "simple"
prompt_prefix="session_name=$SHPOOL_SESSION_NAME "

[env]
PS1 = "prompt> "
TERM = ""
# Realistic quote-sensitive hook with printf, quotes, `\n`.
PROMPT_COMMAND = 'printf "hook_status=%s hook_ps=%s\n" "$?" "${PIPESTATUS[*]}"'
